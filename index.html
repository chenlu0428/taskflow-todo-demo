<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow · 任务管理平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部：标题 + 主题切换 -->
  <header class="app-header">
    <div class="brand">
      <h1>TaskFlow</h1>
      <p>轻量任务管理系统 · 原生 JS</p>
    </div>
    <button id="themeBtn" class="icon-btn" title="切换主题">🌙</button>
  </header>

  <!-- 数据统计仪表盘 -->
  <section class="stats" id="statsBoard">
    <div class="stat-card">
      <span class="stat-num" id="statTotal">0</span>
      <span class="stat-label">总任务</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="statActive">0</span>
      <span class="stat-label">进行中</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="statDone">0</span>
      <span class="stat-label">已完成</span>
    </div>
    <div class="stat-card danger">
      <span class="stat-num" id="statOverdue">0</span>
      <span class="stat-label">已逾期</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="statRate">0%</span>
      <span class="stat-label">完成率</span>
    </div>
  </section>

  <!-- 新增任务卡片 -->
  <section class="card add-card">
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="输入新任务内容..." autocomplete="off">
      <select id="prioritySel" title="优先级">
        <option value="mid">中优先级</option>
        <option value="high">高优先级</option>
        <option value="low">低优先级</option>
      </select>
      <button id="addBtn" class="btn primary">添加</button>
    </div>
    <div class="add-extras">
      <select id="tagSel" title="分类">
        <option value="life">生活</option>
        <option value="work">工作</option>
        <option value="study">学习</option>
        <option value="shop">购物</option>
      </select>
      <input type="date" id="dueDate" title="截止日期">
      <input type="text" id="noteInput" placeholder="备注（可选）" autocomplete="off">
    </div>
  </section>

  <!-- 工具栏：搜索 / 状态筛选 / 分类筛选 / 排序 -->
  <section class="card toolbar">
    <div class="toolbar-top">
      <input type="text" id="searchInput" placeholder="🔍 搜索任务或备注..." autocomplete="off">
      <select id="sortSel" title="排序方式">
        <option value="created">按创建时间</option>
        <option value="due">按截止日期</option>
        <option value="priority">按优先级</option>
        <option value="name">按名称</option>
      </select>
    </div>
    <div class="toolbar-tabs" id="filterTabs">
      <button class="ftab active" data-filter="all">全部</button>
      <button class="ftab" data-filter="active">进行中</button>
      <button class="ftab" data-filter="completed">已完成</button>
    </div>
    <div class="tag-chips" id="tagChips">
      <button class="chip active" data-tag="all">全部</button>
      <button class="chip" data-tag="work">工作</button>
      <button class="chip" data-tag="life">生活</button>
      <button class="chip" data-tag="study">学习</button>
      <button class="chip" data-tag="shop">购物</button>
    </div>
  </section>

  <!-- 任务列表 -->
  <ul id="taskList" class="task-list"></ul>

  <!-- 批量操作栏 -->
  <section class="card batch-bar">
    <button id="completeAllBtn" class="btn success">全部完成</button>
    <button id="clearDoneBtn" class="btn gray">清除已完成</button>
    <span class="spacer"></span>
    <button id="undoBtn" class="btn ghost" title="撤销上一步删除">↩ 撤销</button>
    <button id="exportBtn" class="btn ghost" title="导出为JSON">导出</button>
    <button id="importBtn" class="btn ghost" title="从JSON导入">导入</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </section>

  <footer class="app-footer">
    <span id="footerInfo">数据已本地存储 · 刷新不丢失</span>
  </footer>

  <!-- Toast 通知容器 -->
  <div id="toastWrap" class="toast-wrap"></div>

  <!-- 按加载顺序引入：工具层 → 数据层 → 视图/控制器 -->
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
